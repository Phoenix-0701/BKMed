services:
  - type: web
    name: medflow-server
    plan: free
    env: node
    buildCommand: cd medflow-server && npm install && npm run build && npx prisma generate
    startCommand: cd medflow-server && npm run start:prod
    envVars:
      - key: DATABASE_URL
        value: postgresql://neondb_owner:npg_xNvPKl9ga3kX@ep-flat-credit-b3y09v1y-pooler.c-4.ap-southeast-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require&pgbouncer=true&connect_timeout=15
      - key: DIRECT_URL
        value: postgresql://neondb_owner:npg_xNvPKl9ga3kX@ep-flat-credit-b3y09v1y-pooler.c-4.ap-southeast-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require&connect_timeout=15
      - key: JWT_SECRET
        value: medflow-secret-key-for-local-demo-only
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: AWS_REGION
        value: us-east-1
      - key: PORT
        value: 4000
      - key: SKIP_GIT_LFS
        value: "true"

  - type: web
    name: medflow-ai
    plan: free
    env: docker
    dockerContext: medflow-ai
    dockerfilePath: medflow-ai/Dockerfile
    envVars:
      - key: DB_URI
        value: postgresql://neondb_owner:npg_xNvPKl9ga3kX@ep-flat-credit-b3y09v1y-pooler.c-4.ap-southeast-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require
      - key: OPENAI_API_KEY
        sync: false
      - key: COHERE_API_KEY
        sync: false
      - key: LANGFUSE_SECRET_KEY
        sync: false
      - key: LANGFUSE_PUBLIC_KEY
        sync: false
      - key: LANGFUSE_BASE_URL
        value: https://cloud.langfuse.com
      - key: PORT
        value: 8080
      - key: SKIP_GIT_LFS
        value: "true"
